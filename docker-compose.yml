# Perfis: storage (banco), local (4 nós), node (1 container)
# ./lab storage | ./lab start | ./lab node --docker

x-app-build: &app-build
  build:
    context: .
    dockerfile: src/Dockerfile

x-node-common: &node-common
  <<: *app-build
  command: ["node", "server/bootstrap/main.js"]
  env_file:
    - lab.env
  environment: &node-env-common
    USE_STORAGE_HTTP: "true"
    LOG_STDOUT_MODE: "off"
    SIM_TX_BURST: "1"
    STORAGE_URL: ${LAB_DOCKER_STORAGE_URL:-http://storage:4000}
    DOCKER_PEER_CONNECT_HOST: host.docker.internal
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - lab

networks:
  lab:

services:
  storage:
    <<: *app-build
    profiles:
      - storage
    container_name: ring-storage
    command: ["node", "storage/bootstrap/main.js"]
    env_file:
      - lab.env
    environment:
      DATABASE_PATH: /data/ledger.db
      LEDGER_SCHEMA_PATH: /app/schema-ledger.sql
      LOG_STDOUT_MODE: "off"
    networks:
      - lab
    ports:
      - "4000:4000"
    volumes:
      - ./data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/v1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 8s

  node-3002:
    <<: *node-common
    profiles:
      - local
    container_name: ubuntu-node-3002
    environment:
      <<: *node-env-common
      NODE_PORT: "3002"
      NODE_HTTP_PORT: "4002"
      HOSTNAME: ubuntu-node-3002
    ports:
      - "3002:3002"
      - "4002:4002"

  node-3003:
    <<: *node-common
    profiles:
      - local
    container_name: ubuntu-node-3003
    environment:
      <<: *node-env-common
      NODE_PORT: "3003"
      NODE_HTTP_PORT: "4003"
      HOSTNAME: ubuntu-node-3003
    ports:
      - "3003:3003"
      - "4003:4003"

  node-3004:
    <<: *node-common
    profiles:
      - local
    container_name: ubuntu-node-3004
    environment:
      <<: *node-env-common
      NODE_PORT: "3004"
      NODE_HTTP_PORT: "4004"
      HOSTNAME: ubuntu-node-3004
    ports:
      - "3004:3004"
      - "4004:4004"

  node-3005:
    <<: *node-common
    profiles:
      - local
    container_name: ubuntu-node-3005
    environment:
      <<: *node-env-common
      NODE_PORT: "3005"
      NODE_HTTP_PORT: "4005"
      HOSTNAME: ubuntu-node-3005
    ports:
      - "3005:3005"
      - "4005:4005"

  node-join:
    <<: *node-common
    profiles:
      - node
    container_name: ring-node-join
    environment:
      <<: *node-env-common
      NODE_PORT: ${ADVERTISE_PORT_BASE:-3006}
      HOSTNAME: ring-node-join
    ports:
      - "${ADVERTISE_PORT_BASE:-3006}:${ADVERTISE_PORT_BASE:-3006}"
      - "${NODE_JOIN_HTTP_PORT:-4006}:${NODE_JOIN_HTTP_PORT:-4006}"
